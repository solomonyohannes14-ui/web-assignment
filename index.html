<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Design Workshop</title>
  <!-- Google Fonts for modern clean typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hero / Header Section -->
  <header class="hero-section">
    <div class="container custom-container">
      <span class="badge-pill mb-3">Free workshop</span>
      <h1 class="hero-title">Web Design Workshop</h1>
      <p class="hero-subtitle">Build your first responsive webpage with HTML and Bootstrap.</p>
    </div>
  </header>

  <!-- Main Content -->
  <main class="content-section">
    <div class="container custom-container">
      <div class="row g-4 align-items-start">
        
        <!-- Left Card: Workshop Details -->
        <div class="col-12 col-md-5 col-lg-4">
          <div class="card workshop-card h-100">
            <div class="card-body p-4">
              <h2 class="card-title h4 mb-4">Workshop details</h2>
              
              <div class="detail-group mb-3">
                <span class="detail-label">Day</span>
                <p class="detail-value mb-0">Saturday</p>
              </div>

              <div class="detail-group mb-3">
                <span class="detail-label">Location</span>
                <p class="detail-value mb-0">School computer lab</p>
              </div>

              <div class="detail-group mb-0">
                <span class="detail-label">What to bring</span>
                <p class="detail-value mb-0">A laptop and charger</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Right Card: Registration Form -->
        <div class="col-12 col-md-7 col-lg-8">
          <div class="card registration-card h-100">
            <div class="card-body p-4 p-md-5">
              <h2 class="card-title h4 mb-4">Register for a session</h2>

              <form id="registrationForm" onsubmit="event.preventDefault(); alert('Form submitted successfully!');">
                <div class="mb-3">
                  <label for="fullName" class="form-label">Full name</label>
                  <input type="text" class="form-control" id="fullName" placeholder="" required>
                </div>

                <div class="mb-4">
                  <label for="emailAddress" class="form-label">Email address</label>
                  <input type="email" class="form-control" id="emailAddress" placeholder="" required>
                </div>

                <div class="mb-4">
                  <label class="form-label fw-bold d-block mb-2">Choose a session</label>
                  <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="sessionOption" id="sessionMorning" value="morning" checked>
                    <label class="form-check-label" for="sessionMorning">
                      Morning &middot; 9:00&ndash;11:00 AM
                    </label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="sessionOption" id="sessionAfternoon" value="afternoon">
                    <label class="form-check-label" for="sessionAfternoon">
                      Afternoon &middot; 2:00&ndash;4:00 PM
                    </label>
                  </div>
                </div>

                <div class="mb-3">
                  <button type="submit" class="btn btn-primary btn-register px-4 py-2">Register</button>
                </div>

                <p class="disclaimer-text mb-0">Practice form. Entries are discarded.</p>
              </form>

            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Bootstrap 5.3 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
